  <rect x="8" y="8" width="36" height="24" fill="#c91f2c"/>
  <rect x="8" y="8" width="36" height="2" fill="#ed4b55"/>
  <rect x="8" y="30" width="36" height="2" fill="#8f1722"/>
  <!-- mirrored pixel crescent/star for a right-hand hoist -->
  <rect x="28" y="13" width="5" height="2" fill="#fff9e8"/>
  <rect x="28" y="15" width="7" height="2" fill="#fff9e8"/>
  <rect x="30" y="17" width="6" height="6" fill="#fff9e8"/>
  <rect x="28" y="23" width="7" height="2" fill="#fff9e8"/>
  <rect x="28" y="25" width="5" height="2" fill="#fff9e8"/>
  <rect x="26" y="16" width="5" height="8" fill="#c91f2c"/>
  <rect x="20" y="15" width="2" height="10" fill="#fff9e8"/>
  <rect x="16" y="19" width="10" height="2" fill="#fff9e8"/>
  <rect x="18" y="17" width="6" height="6" fill="#fff9e8"/>
  <rect x="19" y="18" width="4" height="4" fill="#c91f2c"/>
</svg>