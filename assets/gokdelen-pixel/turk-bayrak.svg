<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 108" shape-rendering="crispEdges">
  <!-- long pole: fixed base at SVG bottom -->
  <rect x="43" y="2" width="5" height="103" fill="#183b4d"/>
  <rect x="44" y="3" width="1" height="101" fill="#91b2b7"/>
  <rect x="41" y="105" width="11" height="3" fill="#183b4d"/>
  <rect x="42" y="105" width="9" height="1" fill="#91b2b7"/>
